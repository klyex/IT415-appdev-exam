<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Cafeteria POS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="header-brand">
          <span class="header-badge">Terminal 01 &bull; Cashier Counter</span>
          <h1>Campus Cafeteria POS</h1>
        </div>
      </header>

      <section class="workspace" aria-label="Campus Cafeteria POS workspace">
        <section class="panel products-panel" aria-labelledby="productsTitle">
          <div class="panel-heading">
            <div>
              <h2 id="productsTitle">Cafeteria Menu</h2>
            </div>
            <span class="catalog-badge">6 items available</span>
          </div>
          <div class="product-grid" id="productGrid"></div>
        </section>

        <aside class="checkout-stack">
          <section class="panel cart-panel" aria-labelledby="cartTitle">
            <div class="panel-heading">
              <div>
                <h2 id="cartTitle">Cart Summary</h2>
              </div>
              <span class="count-label" id="cartItemCount">0 items</span>
            </div>

            <div class="empty-state" id="emptyCartMessage">
              <div class="empty-icon" aria-hidden="true">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="9" cy="21" r="1"></circle>
                  <circle cx="20" cy="21" r="1"></circle>
                  <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
              </div>
              <p>No items added yet</p>
              <small>Select food items from the menu to build the order.</small>
            </div>

            <div class="cart-list" id="cartList" aria-live="polite"></div>

            <div class="summary-box">
              <div class="summary-row">
                <span class="summary-label">Total Amount</span>
                <strong class="summary-total" id="cartTotal">₱0.00</strong>
              </div>
            </div>
          </section>

          <section class="panel checkout-panel" aria-labelledby="paymentTitle">
            <div class="panel-heading">
              <div>
                <h2 id="paymentTitle">Checkout</h2>
              </div>
            </div>
            <label class="field-label" for="amountPaid">Amount Paid (Cash)</label>
            <div class="input-currency-wrapper">
              <span class="currency-prefix" aria-hidden="true">₱</span>
              <input id="amountPaid" class="payment-input" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" />
            </div>
            <p class="payment-message" id="paymentMessage" aria-live="polite"></p>
            <button class="primary-button" id="confirmPaymentButton" type="button">Confirm Payment</button>
            <div class="transaction-actions">
              <button class="secondary-button" id="viewReceiptButton" type="button" disabled>View Receipt</button>
              <button class="secondary-button" id="newTransactionButton" type="button" disabled>New Transaction</button>
            </div>
          </section>
        </aside>
      </section>
    </main>

    <div class="modal-backdrop hidden" id="receiptModal" role="dialog" aria-modal="true" aria-labelledby="receiptModalTitle">
      <section class="receipt-modal">
        <div class="modal-heading">
          <div>
            <h2 id="receiptModalTitle">Digital Receipt</h2>
          </div>
          <button class="close-button" id="closeReceiptButton" type="button" aria-label="Close receipt">&times;</button>
        </div>
        <div class="receipt-placeholder" id="receiptContent">
          Transaction receipt will appear here after payment is confirmed.
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
